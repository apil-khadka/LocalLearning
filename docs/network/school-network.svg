<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc" style="font-family:Arial,sans-serif"><title id="title">Digital Himalaya proposed school network</title><desc id="desc">Separate staff, student and server VLANs. Students reach the portal and approved content. Staff use an SSH tunnel. Local AI and management stay private. Example addresses require a site audit.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#71859a" stroke-width="1.5"/></marker></defs><rect width="1160" height="850" rx="18" fill="#ffffff"/><path d="M580.0,80 L580.0,105.0 L580.0,105.0 L580.0,130" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,220 L580.0,260.0 L200.0,260.0 L200.0,300" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,220 L580.0,260.0 L580.0,260.0 L580.0,300" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,220 L580.0,260.0 L960.0,260.0 L960.0,300" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580.0,435 L202.5,535" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M200.0,435 L18,435 L18,730.0 L40,730.0" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M365,585.0 L430,615.0" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M365,730.0 L430,615.0" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M740,615.0 L800,587.5" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M960.0,435 L1140,435 L1140,750.0 L1120,750.0" stroke="#71859a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="430" y="15" width="300" height="65" rx="12" fill="#edf2f7" stroke="#bccbd8"/><text x="446" y="42" font-size="16" font-weight="700" fill="#18374c">Internet / update connection</text><text x="446" y="66" font-size="12.5" fill="#40566a">Optional, disconnected for acceptance</text><rect x="400" y="130" width="360" height="90" rx="12" fill="#e7eefb" stroke="#bccbd8"/><text x="416" y="157" font-size="16" font-weight="700" fill="#18374c">VLAN-aware router / firewall</text><text x="416" y="181" font-size="12.5" fill="#40566a">Default deny between zones; local DHCP/DNS</text><rect x="35" y="300" width="330" height="135" rx="12" fill="#e4f2ed" stroke="#bccbd8"/><text x="51" y="327" font-size="16" font-weight="700" fill="#18374c">Staff / management - VLAN 10</text><text x="51" y="351" font-size="12.5" fill="#40566a">10.42.10.0/24 | gateway .1</text><text x="51" y="373" font-size="12.5" fill="#40566a">Staff Wi-Fi + wired management</text><text x="51" y="395" font-size="12.5" fill="#40566a">SSH to server; no public admin entry</text><rect x="415" y="300" width="330" height="135" rx="12" fill="#e9f1ff" stroke="#bccbd8"/><text x="431" y="327" font-size="16" font-weight="700" fill="#18374c">Students - VLAN 20</text><text x="431" y="351" font-size="12.5" fill="#40566a">10.42.20.0/24 | gateway .1</text><text x="431" y="373" font-size="12.5" fill="#40566a">School learning Wi-Fi, client isolation</text><text x="431" y="395" font-size="12.5" fill="#40566a">Portal and approved learning services only</text><rect x="795" y="300" width="330" height="135" rx="12" fill="#f4edfb" stroke="#bccbd8"/><text x="811" y="327" font-size="16" font-weight="700" fill="#18374c">Learning server - VLAN 30</text><text x="811" y="351" font-size="12.5" fill="#40566a">10.42.30.0/24 | gateway .1</text><text x="811" y="373" font-size="12.5" fill="#40566a">Server reserved at 10.42.30.10</text><text x="811" y="395" font-size="12.5" fill="#40566a">Ethernet to managed switch, protected by UPS</text><rect x="40" y="535" width="325" height="100" rx="12" fill="#e9f1ff" stroke="#bccbd8"/><text x="56" y="562" font-size="16" font-weight="700" fill="#18374c">Student portal :8090</text><text x="56" y="586" font-size="12.5" fill="#40566a">Nginx serves local React assets + /api</text><text x="56" y="608" font-size="12.5" fill="#40566a">Student listener denies /api/admin and /staff</text><rect x="40" y="680" width="325" height="100" rx="12" fill="#e4f2ed" stroke="#bccbd8"/><text x="56" y="707" font-size="16" font-weight="700" fill="#18374c">Staff portal 127.0.0.1:8091</text><text x="56" y="731" font-size="12.5" fill="#40566a">SSH tunnel from management network</text><text x="56" y="753" font-size="12.5" fill="#40566a">Separate listener + staff Bearer token</text><rect x="430" y="555" width="310" height="120" rx="12" fill="#edf2f7" stroke="#bccbd8"/><text x="446" y="582" font-size="16" font-weight="700" fill="#18374c">FastAPI - private Docker network</text><text x="446" y="606" font-size="12.5" fill="#40566a">Catalog + protected document ingestion</text><text x="446" y="628" font-size="12.5" fill="#40566a">Page-aware RAG + bounded model requests</text><text x="446" y="650" font-size="12.5" fill="#40566a">No published API port; no chat storage</text><rect x="800" y="530" width="320" height="115" rx="12" fill="#f4edfb" stroke="#bccbd8"/><text x="816" y="557" font-size="16" font-weight="700" fill="#18374c">Existing local AI services</text><text x="816" y="581" font-size="12.5" fill="#40566a">Ollama and Qdrant, dedicated dh_ index</text><text x="816" y="603" font-size="12.5" fill="#40566a">Server/backend access only</text><text x="816" y="625" font-size="12.5" fill="#40566a">Never expose management/model ports to pupils</text><rect x="800" y="700" width="320" height="100" rx="12" fill="#fff4db" stroke="#bccbd8"/><text x="816" y="727" font-size="16" font-weight="700" fill="#18374c">Kiwix / Kolibri</text><text x="816" y="751" font-size="12.5" fill="#40566a">Only verified student-safe web endpoints</text><text x="816" y="773" font-size="12.5" fill="#40566a">NOMAD admin remains management-only</text><text x="40" y="831" font-size="13" fill="#52697a">Proposed addressing and policy, not a tested field installation. All student traffic stays on the LAN.</text></svg>