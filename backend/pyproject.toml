[project]
name = "digital-himalaya-api"
version = "0.1.0"
description = "Local learning portal API with optional textbook-grounded tutoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.6,<0.116",
  "uvicorn>=0.34.0,<0.35",
  "httpx>=0.28.1,<0.29",
  "pydantic-settings>=2.8.1,<3",
  "pypdf>=5.9,<7",
  "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9", "ruff>=0.11.0,<0.12", "reportlab>=4.3.1,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
exclude-newer = "2026-10-22T00:00:00Z"
