# Student listener: staff API blocked independently of token authentication.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    access_log off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /api/admin { return 403; }
    location ^~ /staff { return 404; }
    location ~ "^/api/textbooks/[a-f0-9]{32}/file$" {
        proxy_pass http://api:8000;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
        proxy_hide_header Content-Security-Policy;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 610s;
        proxy_send_timeout 610s;
    }
    location /assets/ { try_files $uri =404; }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# Staff listener: published on host loopback only, with server-side Bearer auth.
# For remote staff use, SSH-forward this port from the management network.
